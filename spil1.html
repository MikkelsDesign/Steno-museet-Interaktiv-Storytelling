<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <link rel="stylesheet" href="Mainstyle.css" >
    <link rel="stylesheet" href="styles.css" >
    <link rel="stylesheet" href="spil.css" >
    <script src="Canvas.js" defer></script>
    <script src="spil.js" defer></script>
    <script src="script.js" defer></script>
    <title>Steno Museet Interaktiv Storytelling</title>
  </head>
  <body>
    <canvas id="webCanvas"></canvas>

    <div id="game">
      <img id="player" src="img/ægte-hjerte-ikon.png" alt="Player" >
    </div>

    <div id="gameover" class="hidden">
      <div class="go-content">
        <h1>Game Over</h1>
        <img id="result-image" src="/img/Ending1.png" alt="Result Image" >
        <p id="final-score"></p>
        <p id="result-description"></p>
        <button id="to-leaderboard">Til Leaderboardet</button>
      </div>
    </div>

    <div class="controls">
      <button id="left">&#8592;</button>
      <button id="right">&#8594;</button>
    </div>

    <div id="scoreboard">Score: 0 | Time: 60</div>

    
    <div class="top-icons">
      <img src="img/lyd-til.png" alt="Lyd til" class="icon" id="mute-icon">
      <a href="index.html" class="icon-link">
        <img src="img/homeknap.png" alt="Hjem" class="icon">
      </a>
    </div>
    
    <audio id="background-audio" autoplay loop muted>
      <source src="audio/heartbeat.mp3" type="audio/mpeg">
    </audio>
  </body>
</html>
