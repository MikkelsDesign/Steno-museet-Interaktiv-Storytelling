<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Spil 2 Prototype</title>
  <link rel="stylesheet" href="Mainstyle.css" >
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      font-family: 'AUPassata', Arial, sans-serif;
    }
    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 20px;
      font-size: 2rem;
      z-index: 10;
      background-color: #8d1d06;
      font-family: 'AUPassata', Arial, sans-serif;
      color: white;
    }
    #scoreDisplay {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 30px;
      font-family: 'AUPassata', Arial, sans-serif;
    }
    #subtitleDisplay {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px 30px;
      border-radius: 10px;
      font-family: 'AUPassata', Arial, sans-serif;
      font-size: 24px;
      text-align: center;
      max-width: 80%;
      display: none;
      z-index: 20;
    }
  </style>
</head>
<body>
  <button id="startBtn">Start Niveau 2</button>
  <div id="scoreDisplay">Score: 0</div>
  <div id="subtitleDisplay"></div>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const subtitleDisplay = document.getElementById('subtitleDisplay');
    const radialTelegraphs = [];
    const lineTelegraphs = [];


    let width = window.innerWidth;
    let height = window.innerHeight;
    let spiralRotation = 0;
    let spiralActive = false;
    let spiralStartTime = 0;
    let spiralDuration = 3000;

    canvas.width = width;
    canvas.height = height;

    const arena = {
      x: (width - width / 1.35) / 2,
      y: (height - height / 1.35) / 2,
      width: width / 1.35,
      height: height / 1.35
    };

    const player = {
      x: arena.x + arena.width / 2,
      y: arena.y + arena.height / 2,
      radius: 15, // Slightly larger radius for the heart icon
      width: 30,  // Width for the heart image
      height: 35, // Height for the heart image
      vx: 0,
      vy: 0,
      speed: 0.2,
      maxSpeed: 2,
      friction: 0.95
    };

    const keys = {};
    document.addEventListener('keydown', e => keys[e.key] = true);
    document.addEventListener('keyup', e => keys[e.key] = false);

    const bullets = [];
    let startTime = null;
    let lastScoreTick = null;
    let running = false;
    let score = 0;

    // Load player heart icon
    const playerImage = new Image();
    playerImage.src = 'img/ægte-hjerte-ikon.png';
    let playerImageLoaded = false;
    
    playerImage.onload = () => {
      playerImageLoaded = true;
      console.log('Player heart icon loaded successfully');
    };
    
    playerImage.onerror = () => {
      console.warn('Could not load player heart icon, falling back to circle');
    };

    let attackIndex = 0;
    const attacks = [
      { time: 3500, action: spawnSpiralFlowerBursts, audio: 'attack1', subtitle: 'Det første angreb begynder...' },
      { time: 11500, action: spawnSpinningSpiralAttack, audio: 'attack2', subtitle: 'Spiralens kraft vækkes!' },
      { time: 21000, action: spawnZigzagCurtain, audio: 'attack3', subtitle: 'En mur af fare nærmer sig...' }
    ];

    // Audio/Subtitle Framework
    const audioPlaybook = {
      // Attack-specific audio clips
      attack1: { 
        src: 'audio/attack1.mp3', 
        volume: 0.7,
        subtitle: 'Det første angreb begynder...',
        duration: 3000
      },
      attack2: { 
        src: 'audio/attack2.mp3', 
        volume: 0.8,
        subtitle: 'Spiralens kraft vækkes!',
        duration: 4000
      },
      attack3: { 
        src: 'audio/attack3.mp3', 
        volume: 0.6,
        subtitle: 'En mur af fare nærmer sig...',
        duration: 2500
      },
      // Background music and ambience
      background: { 
        src: 'audio/background_tension.mp3', 
        volume: 0.3,
        loop: true
      },
      gameStart: { 
        src: 'audio/game_start.mp3', 
        volume: 0.5,
        subtitle: 'Forbered dig på kampen...',
        duration: 2000
      },
      hit: { 
        src: 'audio/hit_sound.mp3', 
        volume: 0.4
      }
    };

    let currentAudio = null;
    let subtitleTimeout = null;

    // Audio management functions
    function playAudio(audioKey, options = {}) {
      const audioData = audioPlaybook[audioKey];
      if (!audioData) {
        console.warn(`Audio key "${audioKey}" not found in playbook`);
        return null;
      }

      // Stop current audio if specified
      if (options.stopCurrent && currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      const audio = new Audio(audioData.src);
      audio.volume = options.volume !== undefined ? options.volume : audioData.volume;
      audio.loop = audioData.loop || false;

      // Handle audio loading and playback
      audio.addEventListener('loadeddata', () => {
        audio.play().catch(error => {
          console.warn(`Could not play audio "${audioKey}":`, error);
        });
      });

      // Set as current audio if not a short sound effect
      if (!audioKey.includes('hit') && !audioKey.includes('effect')) {
        currentAudio = audio;
      }

      // Show subtitle if available
      if (audioData.subtitle || options.subtitle) {
        showSubtitle(options.subtitle || audioData.subtitle, audioData.duration || 3000);
      }

      return audio;
    }

    // Subtitle management functions
    function showSubtitle(text, duration = 3000) {
      if (!text) return;
      
      // Clear any existing subtitle timeout
      if (subtitleTimeout) {
        clearTimeout(subtitleTimeout);
      }

      // Update subtitle content and show
      subtitleDisplay.textContent = text;
      subtitleDisplay.style.display = 'block';
      
      // Fade in effect
      subtitleDisplay.style.opacity = '0';
      subtitleDisplay.style.transition = 'opacity 0.3s ease-in';
      setTimeout(() => {
        subtitleDisplay.style.opacity = '1';
      }, 10);

      // Hide after duration
      subtitleTimeout = setTimeout(() => {
        hideSubtitle();
      }, duration);
    }

    function hideSubtitle() {
      subtitleDisplay.style.transition = 'opacity 0.3s ease-out';
      subtitleDisplay.style.opacity = '0';
      setTimeout(() => {
        subtitleDisplay.style.display = 'none';
      }, 300);
    }

    // Attack sequence integration functions
    function triggerAttackWithAudio(attack) {
      // Play attack-specific audio and subtitle
      if (attack.audio) {
        playAudio(attack.audio, { 
          subtitle: attack.subtitle,
          stopCurrent: false // Allow audio to layer for intensity
        });
      }
      
      // Execute the attack action
      attack.action();
    }

    // Background audio management
    function startBackgroundAudio() {
      playAudio('background', { volume: 0.2 });
    }

    function stopAllAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      hideSubtitle();
    }

function spawnZigzagCurtain() {
  const gapHeight = 150; // Increased gap height for easier passage
  const blockSize = 20;
  const rows = Math.floor(arena.height / blockSize);
  const minGapBlocks = Math.ceil(gapHeight / blockSize); // Minimum blocks needed for gap
  const safetyMargin = 2; // Extra blocks margin from edges
  
  // Ensure gap starts within safe bounds
  const minGapY = safetyMargin * blockSize;
  const maxGapY = (rows - minGapBlocks - safetyMargin) * blockSize;
  
  // Calculate safe initial gap position
  let gapY = Math.floor(Math.random() * (maxGapY - minGapY)) + minGapY;
  let zigzagDirection = 1;
  const maxZigzagAmount = blockSize * 2; // Limit how much the gap can move per column

  for (let col = 0; col < 80; col++) {
    for (let i = 0; i < rows; i++) {
      const y = arena.y + i * blockSize;
      if (y < arena.y + gapY || y > arena.y + gapY + gapHeight) {
        bullets.push({
          x: arena.x + arena.width + col * blockSize,
          y: y,
          width: blockSize - 2,
          height: blockSize - 2,
          vx: -2.5,
          vy: 0,
          hasHitPlayer: false
        });
      }
    }
    
    // Controlled zigzag movement with bounds checking
    if (Math.random() < 0.4) { // Reduced randomness for more predictable movement
      const movement = zigzagDirection * blockSize;
      const newGapY = gapY + movement;
      
      // Check if new position would be within safe bounds
      if (newGapY >= minGapY && newGapY <= maxGapY) {
        gapY = newGapY;
      } else {
        // Reverse direction if hitting bounds
        zigzagDirection *= -1;
      }
    }
    
    // Additional safety check - reverse direction if getting too close to edges
    if (gapY <= minGapY + blockSize || gapY >= maxGapY - blockSize) {
      zigzagDirection *= -1;
    }
  }
}


function spawnSpiralFlowerBursts() {
  const bursts = 7;
  for (let i = 0; i < bursts; i++) {
    const delay = i * 800; // More spaced out - 800ms between each burst
    const centerX = arena.x + Math.random() * arena.width;
    const centerY = arena.y + Math.random() * arena.height;

    // Add a telegraph that lasts just before the burst
    radialTelegraphs.push({
      x: centerX,
      y: centerY,
      radius: 40,
      startTime: performance.now() + delay,
      duration: 800
    });

    setTimeout(() => {
      const num = 24;
      const speed = 2;
      for (let j = 0; j < num; j++) {
        const angle = (j / num) * 2 * Math.PI;
        bullets.push({
          x: centerX,
          y: centerY,
          width: 16,
          height: 16,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          hasHitPlayer: false
        });
      }
    }, delay + 800);
  }
}




function spawnSpinningSpiralAttack() {
  const centerX = arena.x + arena.width / 2;
  const centerY = arena.y + arena.height / 2;

  const duration = 6000; // Longer duration - 6 seconds instead of 4
  const segments = 41; // One more segment - 41 instead of 40
  const directions = 6; // Fewer directions - 6 instead of 10
  const speed = 2.2; // Faster speed - 2.2 instead of 1.8
  const telegraphDelay = 800;

  // Telegraph in center
  radialTelegraphs.push({
    x: centerX,
    y: centerY,
    radius: 100,
    startTime: performance.now(),
    duration: telegraphDelay
  });

  for (let i = 0; i < segments; i++) {
    const delay = telegraphDelay + (i / segments) * duration;
    const baseAngle = (i / segments) * Math.PI * 2; // 360° arc over 6s - faster rotation

    setTimeout(() => {
      for (let d = 0; d < directions; d++) {
        const angle = baseAngle + (d * (2 * Math.PI / directions));
        bullets.push({
          x: centerX,
          y: centerY,
          width: 16,
          height: 16,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          hasHitPlayer: false,
          born: performance.now(),
          ttl: 8000 // Longer bullet lifetime
        });
      }
    }, delay);
  }
}






    function updatePlayer() {
      if (keys['ArrowUp']) player.vy -= player.speed;
      if (keys['ArrowDown']) player.vy += player.speed;
      if (keys['ArrowLeft']) player.vx -= player.speed;
      if (keys['ArrowRight']) player.vx += player.speed;

      // Apply friction
      player.vx *= player.friction;
      player.vy *= player.friction;

      // Clamp speed
      player.vx = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.vx));
      player.vy = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.vy));

      player.x += player.vx;
      player.y += player.vy;

      // Bound inside arena
      player.x = Math.max(arena.x + player.radius, Math.min(arena.x + arena.width - player.radius, player.x));
      player.y = Math.max(arena.y + player.radius, Math.min(arena.y + arena.height - player.radius, player.y));
    }

   function updateBullets() {
  const now = performance.now();
  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;

    if (b.ttl && now - b.born > b.ttl) {
      bullets.splice(i, 1); // Remove expired bullet
    }
  }
}

    function drawArena() {
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 2;
      ctx.strokeRect(arena.x, arena.y, arena.width, arena.height);
    }

    function drawPlayer() {
      if (playerImageLoaded) {
        // Draw the heart icon centered on the player position
        ctx.drawImage(
          playerImage, 
          player.x - player.width / 2, 
          player.y - player.height / 2, 
          player.width, 
          player.height
        );
      } else {
        // Fallback to red circle if image isn't loaded
        ctx.fillStyle = 'red';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

  function drawBullets() {
  ctx.fillStyle = 'white';
  for (let bullet of bullets) {
    ctx.save();
    ctx.translate(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2);
    ctx.rotate((bullet.angle || 0) * Math.PI / 180);
    ctx.fillRect(-bullet.width / 2, -bullet.height / 2, bullet.width, bullet.height);
    ctx.restore();
  }
}

function drawRadialTelegraphs(currentTime) {
  for (let t of radialTelegraphs) {
    const elapsed = currentTime - t.startTime;
    if (elapsed >= 0 && elapsed <= t.duration) {
      const pulse = (Math.sin((elapsed / t.duration) * Math.PI * 4) + 1) / 2; // oscillates 0–1
      const opacity = 0.3 + 0.4 * pulse;

      const gradient = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, t.radius);
      gradient.addColorStop(0, `rgba(255, 0, 0, ${opacity})`);
      gradient.addColorStop(1, `rgba(255, 0, 0, 0)`);

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawLineTelegraphs(currentTime) {
  ctx.save();
  for (let t of lineTelegraphs) {
    const elapsed = currentTime - t.startTime;
    if (elapsed >= 0 && elapsed <= t.duration) {
      const pulse = (Math.sin((elapsed / t.duration) * Math.PI * 4) + 1) / 2;
      const opacity = 0.3 + 0.4 * pulse;
      ctx.translate(t.x, t.y);
      ctx.rotate((t.angle || 0) * Math.PI / 180);
      ctx.fillStyle = `rgba(255, 0, 0, ${opacity})`;
      ctx.fillRect(-t.width / 2, -t.height / 2, t.width, t.height);
      ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform
    }
  }
  ctx.restore();
}



   function checkCollisions() {
  for (let bullet of bullets) {
    if (bullet.hasHitPlayer) continue;

    let dx = Math.abs(player.x - (bullet.x + bullet.width / 2));
    let dy = Math.abs(player.y - (bullet.y + bullet.height / 2));
    if (dx < player.radius + bullet.width / 2 && dy < player.radius + bullet.height / 2) {
      bullet.hasHitPlayer = true;
      score -= 1;
      
      // Play hit sound effect
      playAudio('hit');
      
      console.log("HIT!");
    }
  }
}

    function runAttackSequence(currentTime) {
      while (attackIndex < attacks.length && currentTime - startTime >= attacks[attackIndex].time) {
        triggerAttackWithAudio(attacks[attackIndex]);
        attackIndex++;
      }
    }

    function updateScore(currentTime) {
      if (currentTime - lastScoreTick >= 1000) {
        score += 1;
        lastScoreTick = currentTime;
      }
      scoreDisplay.textContent = `Score: ${score}`;
      
      // Check for game completion (after all attacks)
      if (attackIndex >= attacks.length && currentTime - startTime >= 30000) {
        endGame();
      }
    }

    function endGame() {
      running = false;
      stopAllAudio();
      
      // Show final score and message
      showSubtitle(`Spil afsluttet! Din endelige score: ${score}`, 5000);
      
      // Option to restart
      setTimeout(() => {
        const restartBtn = document.createElement('button');
        restartBtn.textContent = 'Spil igen';
        restartBtn.style.position = 'absolute';
        restartBtn.style.top = '50%';
        restartBtn.style.left = '50%';
        restartBtn.style.transform = 'translate(-50%, -50%)';
        restartBtn.style.padding = '10px 20px';
        restartBtn.style.fontSize = '1.5rem';
        restartBtn.style.backgroundColor = '#8d1d06';
        restartBtn.style.color = 'white';
        restartBtn.style.border = 'none';
        restartBtn.style.fontFamily = 'AUPassata, Arial, sans-serif';
        restartBtn.style.cursor = 'pointer';
        restartBtn.style.zIndex = '25';
        
        restartBtn.onclick = () => {
          location.reload();
        };
        
        document.body.appendChild(restartBtn);
      }, 3000);
    }

function loop() {
  if (!running) return;
  const currentTime = performance.now();

  ctx.clearRect(0, 0, width, height);

  updatePlayer();
  updateBullets();
  checkCollisions();
  runAttackSequence(currentTime);
  updateScore(currentTime);

  drawRadialTelegraphs(currentTime);
  drawLineTelegraphs(currentTime);
  drawArena();
  drawPlayer();
  drawBullets();

  requestAnimationFrame(loop);
}

// ✅ THEN call it from button
startBtn.onclick = () => {
  if (!running) {
    startTime = performance.now();
    lastScoreTick = startTime;
    running = true;
    startBtn.style.display = "none";
    
    // Initialize audio experience
    playAudio('gameStart');
    setTimeout(() => {
      startBackgroundAudio();
    }, 2500); // Start background music after game start audio
    
    loop(); // now works
  }
};

  </script>
</body>
</html>
